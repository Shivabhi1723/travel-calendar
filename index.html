<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Travel Calendar 🌍✨</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(to right, #fbc2eb, #a6c1ee);
      color: #333;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #4A00E0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    th, td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }
    th {
      background-color: #6a11cb;
      color: white;
    }
    tr:hover {background-color: #f1f1f1;}
    button {
      padding: 6px 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 2px;
    }
    .add-btn {
      background-color: #00C9FF;
      color: white;
      font-size: 16px;
      padding: 10px 20px;
      margin-bottom: 15px;
      border-radius: 12px;
    }
    .edit-btn {
      background-color: #ffb347;
    }
    .delete-btn {
      background-color: #ff6b6b;
      color: white;
    }
    input, select {
      padding: 6px;
      margin: 4px;
    }
    img {
      max-width: 70px;
      max-height: 50px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

<h1>🌍 My Travel Calendar ✈️</h1>
<button class="add-btn" onclick="openForm()">➕ Add New Trip</button>

<table>
  <thead>
    <tr>
      <th>Trip Name</th>
      <th>Dates</th>
      <th>Destination</th>
      <th>Type</th>
      <th>Travelers</th>
      <th>Photo</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="tripTable"></tbody>
</table>

<!-- Form -->
<div id="formDiv" style="display:none; margin-top:20px;">
  <h3 id="formTitle">Add New Trip</h3>
  <input type="text" id="tripName" placeholder="Trip Name">
  <input type="text" id="dates" placeholder="Dates (e.g. May 2–10, 2025)">
  <input type="text" id="destination" placeholder="Destination">
  <select id="tripType">
    <option value="Solo">Solo</option>
    <option value="Family">Family</option>
    <option value="Friends">Friends</option>
  </select>
  <input type="text" id="travelers" placeholder="Travelers">
  <input type="file" id="photoInput">
  <br>
  <button onclick="saveTrip()">💾 Save</button>
  <button onclick="closeForm()">❌ Cancel</button>
</div>

<script>
  let trips = JSON.parse(localStorage.getItem('trips')) || [];
  let editIndex = null;

  function renderTable() {
    const table = document.getElementById('tripTable');
    table.innerHTML = '';
    trips.forEach((trip, index) => {
      table.innerHTML += `
        <tr>
          <td>${trip.name}</td>
          <td>${trip.dates}</td>
          <td>${trip.destination}</td>
          <td>${trip.type}</td>
          <td>${trip.travelers}</td>
          <td>${trip.photo ? '<img src="' + trip.photo + '">' : '—'}</td>
          <td>
            <button class="edit-btn" onclick="editTrip(${index})">✏️ Edit</button>
            <button class="delete-btn" onclick="deleteTrip(${index})">❌ Delete</button>
          </td>
        </tr>
      `;
    });
    localStorage.setItem('trips', JSON.stringify(trips));
  }

  function openForm() {
    document.getElementById('formDiv').style.display = 'block';
    document.getElementById('formTitle').innerText = 'Add New Trip';
    clearForm();
    editIndex = null;
  }

  function closeForm() {
    document.getElementById('formDiv').style.display = 'none';
  }

  function clearForm() {
    document.getElementById('tripName').value = '';
    document.getElementById('dates').value = '';
    document.getElementById('destination').value = '';
    document.getElementById('tripType').value = 'Solo';
    document.getElementById('travelers').value = '';
    document.getElementById('photoInput').value = '';
  }

  function saveTrip() {
    const name = document.getElementById('tripName').value;
    const dates = document.getElementById('dates').value;
    const destination = document.getElementById('destination').value;
    const type = document.getElementById('tripType').value;
    const travelers = document.getElementById('travelers').value;
    const photoInput = document.getElementById('photoInput');

    if (photoInput.files.length > 0) {
      const reader = new FileReader();
      reader.onload = function() {
        const photo = reader.result;
        saveData(name, dates, destination, type, travelers, photo);
      };
      reader.readAsDataURL(photoInput.files[0]);
    } else {
      saveData(name, dates, destination, type, travelers, null);
    }
  }

  function saveData(name, dates, destination, type, travelers, photo) {
    const tripData = { name, dates, destination, type, travelers, photo };

    if (editIndex !== null) {
      trips[editIndex] = tripData;
    } else {
      trips.push(tripData);
    }

    renderTable();
    closeForm();
  }

  function editTrip(index) {
    const trip = trips[index];
    openForm();
    document.getElementById('formTitle').innerText = 'Edit Trip';
    document.getElementById('tripName').value = trip.name;
    document.getElementById('dates').value = trip.dates;
    document.getElementById('destination').value = trip.destination;
    document.getElementById('tripType').value = trip.type;
    document.getElementById('travelers').value = trip.travelers;
    editIndex = index;
  }

  function deleteTrip(index) {
    if (confirm('Are you sure you want to delete this trip?')) {
      trips.splice(index, 1);
      renderTable();
    }
  }

  renderTable();
</script>

</body>
</html>
