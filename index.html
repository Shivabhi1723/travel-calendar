<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Travel Calendar</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f4f8;
      color: #333;
    }
    header {
      background-color: #4caf50;
      color: white;
      padding: 1rem;
      text-align: center;
    }
    main {
      padding: 2rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 2rem;
    }
    table, th, td {
      border: 1px solid #ccc;
    }
    th, td {
      padding: 0.75rem;
      text-align: left;
    }
    th {
      background-color: #e0e0e0;
    }
    footer {
      background-color: #4caf50;
      color: white;
      text-align: center;
      padding: 1rem;
      position: fixed;
      bottom: 0;
      width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>My Travel Calendar</h1>
  </header>

  <main>
    <h2>Upcoming Trips</h2>
    <table>
      <thead>
        <tr>
          <th>Trip Name</th>
          <th>Dates</th>
          <th>Destination</th>
          <th>Trip Type</th>
          <th>Travelers</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Japan Solo Trip 🇯🇵</td>
          <td>May 2–10, 2025</td>
          <td>Tokyo & Kyoto</td>
          <td>Solo</td>
          <td>Me</td>
          <td>Planned</td>
        </tr>
        <tr>
          <td>Family Italy Vacation 🇮🇹</td>
          <td>July 15–25, 2025</td>
          <td>Rome, Florence, Venice</td>
          <td>Family</td>
          <td>Me, Partner, Kids</td>
          <td>Idea</td>
        </tr>
      </tbody>
    </table>
  </main>

  <footer>
    <p>Happy Travels! ✈️🗺️</p>
  </footer>
</body>
</html>
